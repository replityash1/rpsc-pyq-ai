<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPSC Question Bank Viewer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md py-6 px-4 mb-8">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-2xl font-bold">RPSC Exam Question Bank</h1>
            <span id="question-count" class="bg-indigo-800 text-indigo-100 text-sm px-3 py-1 rounded-full mt-2 sm:mt-0">Loading questions...</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 pb-12">
        <div id="questions-container" class="space-y-6">
            <!-- Questions will be dynamically inserted here -->
        </div>
    </main>

    <!-- JavaScript to Load and Render JSON -->
    <script>
        async function loadQuestions() {
            try {
                const response = await fetch('question_bank.json');
                if (!response.ok) throw new Error('Failed to load question_bank.json');
                
                const data = await response.json();
                const questions = data.questions || [];
                
                document.getElementById('question-count').innerText = `Total Questions: ${questions.length}`;
                
                const container = document.getElementById('questions-container');
                container.innerHTML = '';

                if (questions.length === 0) {
                    container.innerHTML = '<p class="text-center text-slate-500 py-12">No questions found in the question bank.</p>';
                    return;
                }

                questions.forEach((q, index) => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-xl shadow-sm border border-slate-200 p-6 transition hover:shadow-md';

                    // Question Header & Number
                    let html = `
                        <div class="flex items-start justify-between border-b border-slate-100 pb-4 mb-4">
                            <span class="bg-indigo-100 text-indigo-700 font-semibold px-3 py-1 rounded-lg text-sm">
                                Question #${q.number || (index + 1)}
                            </span>
                        </div>
                    `;

                    // Question Text (Hindi & English)
                    html += `
                        <div class="space-y-3 mb-6">
                            <div class="text-lg font-medium text-slate-900 leading-relaxed font-sans">
                                <span class="text-xs uppercase tracking-wider text-indigo-600 font-bold block mb-1">Hindi</span>
                                ${q.question_hi || ''}
                            </div>
                            <div class="text-base text-slate-600 leading-relaxed font-sans border-t border-slate-50 pt-2">
                                <span class="text-xs uppercase tracking-wider text-slate-400 font-bold block mb-1">English</span>
                                ${q.question_en || ''}
                            </div>
                        </div>
                    `;

                    // Main Question Diagram (if present)
                    if (q.diagram_path) {
                        html += `
                            <div class="mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200 text-center">
                                <img src="${q.diagram_path}" alt="Question Diagram" class="max-h-64 mx-auto rounded shadow-sm">
                                <span class="text-xs text-slate-400 mt-2 block">Attached Diagram / Figure</span>
                            </div>
                        `;
                    }

                    // Options List
                    html += `<div class="space-y-3"><span class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">Options</span>`;
                    
                    if (q.options && q.options.length > 0) {
                        q.options.forEach(opt => {
                            html += `
                                <div class="flex items-start bg-slate-50 hover:bg-indigo-50/50 border border-slate-200/80 rounded-lg p-3 transition">
                                    <span class="font-bold text-indigo-600 w-8 flex-shrink-0">(${opt.label})</span>
                                    <div class="flex-grow space-y-1">
                                        <div class="text-sm text-slate-900">${opt.hi || ''}</div>
                                        <div class="text-xs text-slate-500">${opt.en || ''}</div>
                                        ${opt.image_path ? `<div class="mt-2"><img src="${opt.image_path}" alt="Option Image" class="max-h-32 rounded border border-slate-200"></div>` : ''}
                                    </div>
                                </div>
                            `;
                        });
                    }
                    html += `</div>`;

                    card.innerHTML = html;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('questions-container').innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-lg text-center">
                        <p class="font-bold">Could not load question bank.</p>
                        <p class="text-sm mt-1">Make sure the GitHub Action has finished running at least once and generated <code>question_bank.json</code>.</p>
                    </div>
                `;
                document.getElementById('question-count').innerText = 'Error loading data';
            }
        }

        loadQuestions();
    </script>
</body>
</html>
