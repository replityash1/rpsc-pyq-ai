<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPSC Question Bank Viewer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MathJax Configuration -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            startup: {
                typeset: false
            }
        };
    </script>
    
    <!-- MathJax Library -->
    <script id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        /* Preserves newlines (\n) from JSON for equations and tables */
        .preserve-lines { white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- Header & Navigation -->
    <header class="bg-indigo-700 text-white shadow-md py-5 px-4 mb-8 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold tracking-wide">RPSC Exam Question Bank</h1>
            
            <!-- Controls -->
            <div class="flex items-center gap-4">
                <!-- Language Toggle -->
                <div class="flex bg-indigo-900 p-1 rounded-lg text-sm font-medium shadow-inner">
                    <button id="btn-hi" onclick="setLanguage('hi')" class="px-4 py-1.5 rounded-md transition-all duration-200 bg-white text-indigo-900 shadow">Hindi</button>
                    <button id="btn-en" onclick="setLanguage('en')" class="px-4 py-1.5 rounded-md transition-all duration-200 text-indigo-100 hover:text-white">English</button>
                    <button id="btn-both" onclick="setLanguage('both')" class="px-4 py-1.5 rounded-md transition-all duration-200 text-indigo-100 hover:text-white">Bilingual</button>
                </div>
                <!-- Counter -->
                <span id="question-count" class="bg-indigo-100 text-indigo-800 text-sm px-3 py-1.5 rounded-full font-bold shadow-sm whitespace-nowrap">
                    Loading...
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 pb-12">
        <div id="questions-container" class="space-y-8">
            <!-- Questions will be dynamically inserted here -->
        </div>
    </main>

    <!-- Core Logic -->
    <script>
        // 1. Smart Text Formatter (Fixes clumped statements and formatting)
        function formatText(text) {
            if (!text) return "";
            let formatted = text.trim();
            
            // Protect existing newlines for block equations
            formatted = formatted.replace(/\n/g, '<br>');
            
            // Auto-format Statement lists (A., B., C. or (i), (ii) or (1), (2))
            // Adds a line break and indents them so they look like a proper list
            formatted = formatted.replace(/\s([A-E]\.)\s/g, '<br><span class="font-semibold text-indigo-700 ml-4">$1</span> ');
            formatted = formatted.replace(/\s(\([iI]+v?\))\s/g, '<br><span class="font-semibold text-indigo-700 ml-4">$1</span> ');
            formatted = formatted.replace(/\s(\(\d+\))\s/g, '<br><span class="font-semibold text-indigo-700 ml-4">$1</span> ');
            formatted = formatted.replace(/(कथन\s[A-Z]\s*:|Statement\s[A-Z]\s*:)/gi, '<br><span class="font-semibold text-indigo-700 mt-2 block">$1</span>');
            
            return formatted;
        }

        // 2. Language Toggle Logic
        function setLanguage(lang) {
            // Update Buttons
            const btns = ['hi', 'en', 'both'];
            btns.forEach(b => {
                const el = document.getElementById(`btn-${b}`);
                if (b === lang) {
                    el.className = "px-4 py-1.5 rounded-md transition-all duration-200 bg-white text-indigo-900 shadow";
                } else {
                    el.className = "px-4 py-1.5 rounded-md transition-all duration-200 text-indigo-100 hover:text-white";
                }
            });

            // Update Visibility
            document.querySelectorAll('.lang-hi').forEach(el => {
                el.style.display = (lang === 'hi' || lang === 'both') ? 'block' : 'none';
            });
            document.querySelectorAll('.lang-en').forEach(el => {
                el.style.display = (lang === 'en' || lang === 'both') ? 'block' : 'none';
            });
        }

        // 3. Load, Clean, and Render Data
        async function loadQuestions() {
            try {
                const response = await fetch('question_bank.json');
                if (!response.ok) throw new Error('Failed to load question_bank.json');
                
                const data = await response.json();
                const rawQuestions = data.questions || [];
                
                // --- DE-DUPLICATION ENGINE ---
                const uniqueQuestions = [];
                const seenText = new Set();

                rawQuestions.forEach(q => {
                    // Use the text as a fingerprint to catch duplicates
                    const fingerprint = (q.question_hi || q.question_en || "").trim();
                    if (!fingerprint) return; // Skip completely empty blanks

                    if (!seenText.has(fingerprint)) {
                        seenText.add(fingerprint);
                        uniqueQuestions.push(q);
                    }
                });

                document.getElementById('question-count').innerText = `Total Questions: ${uniqueQuestions.length}`;
                
                const container = document.getElementById('questions-container');
                container.innerHTML = '';

                if (uniqueQuestions.length === 0) {
                    container.innerHTML = '<p class="text-center text-slate-500 py-12">No valid questions found.</p>';
                    return;
                }

                // --- RENDERING ENGINE ---
                uniqueQuestions.forEach((q, index) => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-xl shadow-sm border border-slate-200 p-6 transition hover:shadow-md';

                    // Re-number sequentially based on clean array
                    let html = `
                        <div class="flex items-start justify-between border-b border-slate-100 pb-3 mb-4">
                            <span class="bg-indigo-50 text-indigo-700 font-bold px-3 py-1 rounded-lg text-sm shadow-sm border border-indigo-100">
                                Question ${index + 1}
                            </span>
                        </div>
                    `;

                    // Question Text Container
                    html += `<div class="mb-6 space-y-4 preserve-lines">`;
                    
                    if (q.question_hi) {
                        html += `
                            <div class="lang-hi text-lg font-medium text-slate-900 leading-relaxed overflow-x-auto">
                                ${formatText(q.question_hi)}
                            </div>`;
                    }
                    if (q.question_en) {
                        // If both exist, give English a top border when in bilingual mode
                        const borderClass = q.question_hi ? "border-t border-slate-100 pt-3" : "";
                        html += `
                            <div class="lang-en text-base text-slate-600 leading-relaxed overflow-x-auto ${borderClass}">
                                ${formatText(q.question_en)}
                            </div>`;
                    }
                    html += `</div>`;

                    // Attached Diagram (Supports both new and old JSON keys)
                    const diagramPath = q.diagram_path || q.visual;
                    if (diagramPath) {
                        html += `
                            <div class="mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200 text-center">
                                <img src="${diagramPath}" alt="Question Diagram" class="max-h-64 mx-auto rounded shadow-sm">
                                <span class="text-xs text-slate-400 mt-2 block">Reference Diagram</span>
                            </div>
                        `;
                    }

                    // Options List
                    html += `<div class="space-y-3">`;
                    
                    if (q.options && q.options.length > 0) {
                        q.options.forEach(opt => {
                            // Ensure the option label handles HTML safely
                            const optLabel = opt.label ? opt.label.replace(/</g, "&lt;") : "?";
                            
                            html += `
                                <div class="flex items-start bg-slate-50 hover:bg-indigo-50/40 border border-slate-200 rounded-lg p-3 transition preserve-lines overflow-x-auto">
                                    <span class="font-bold text-indigo-600 w-8 flex-shrink-0 mt-0.5">(${optLabel})</span>
                                    <div class="flex-grow space-y-2">`;

                            if (opt.hi) {
                                html += `<div class="lang-hi text-sm text-slate-900">${formatText(opt.hi)}</div>`;
                            }
                            if (opt.en) {
                                html += `<div class="lang-en text-sm text-slate-500">${formatText(opt.en)}</div>`;
                            }
                            
                            const optImgPath = opt.image_path || opt.visual;
                            if (optImgPath) {
                                html += `<div class="mt-2"><img src="${optImgPath}" alt="Option Image" class="max-h-32 rounded border border-slate-200"></div>`;
                            }

                            html += `</div></div>`;
                        });
                    }
                    html += `</div>`;

                    card.innerHTML = html;
                    container.appendChild(card);
                });

                // Apply default language selection (Hindi is default)
                setLanguage('hi');

                // Force MathJax to render
                setTimeout(() => {
                    if (window.MathJax) {
                        window.MathJax.typesetClear();
                        window.MathJax.typeset();
                    }
                }, 300);

            } catch (error) {
                console.error(error);
                document.getElementById('questions-container').innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-700 p-6 rounded-xl text-center shadow-sm">
                        <p class="font-bold text-lg">Could not load question bank.</p>
                        <p class="mt-2">Make sure <code>question_bank.json</code> is present in your repository.</p>
                    </div>
                `;
                document.getElementById('question-count').innerText = 'Error';
            }
        }

        // Initialize App
        loadQuestions();
    </script>
</body>
</html>
