name: Process PYQ

on:
  workflow_dispatch:
  push:
    paths:
      - "input/**"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            wget \
            python3 \
            python3-pip \
            poppler-utils

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install pymupdf pillow

      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build \
            -DGGML_NATIVE=ON
          cmake --build llama.cpp/build \
            --config Release \
            -j4

      - name: Download Qwen3-VL
        run: |
          pip install -U huggingface_hub

          mkdir -p models

          huggingface-cli download \
            Qwen/Qwen3-VL-4B-Instruct-GGUF \
            Qwen3-VL-4B-Instruct-Q4_K_M.gguf \
            --local-dir models

          huggingface-cli download \
            Qwen/Qwen3-VL-4B-Instruct-GGUF \
            mmproj-BF16.gguf \
            --local-dir models

      - name: Find PDF
        id: pdf
        run: |
          PDF=$(find input -type f -iname "*.pdf" | head -n 1)

          if [ -z "$PDF" ]; then
            echo "No PDF found."
            exit 1
          fi

          echo "pdf=$PDF" >> "$GITHUB_OUTPUT"

      - name: Render PDF pages
        run: |
          mkdir -p pages

          pdftoppm \
            -jpeg \
            -r 120 \
            "${{ steps.pdf.outputs.pdf }}" \
            pages/page

      - name: Process first page as proof of concept
        run: |
          mkdir -p output

          llama.cpp/build/bin/llama-server \
            -m models/Qwen3-VL-4B-Instruct-Q4_K_M.gguf \
            --mmproj models/mmproj-BF16.gguf \
            --host 127.0.0.1 \
            --port 8080 \
            -c 8192 \
            -ngl 0 \
            > server.log 2>&1 &

          sleep 20

          python3 scripts/test_page.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          git diff --cached --quiet || \
            git commit -m "Process PYQ"

          git push
