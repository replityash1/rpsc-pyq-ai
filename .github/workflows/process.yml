name: Test PYQ AI Matrix

on:
  workflow_dispatch:
  push:
    paths:
      - "input/**"

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Cache Engine and Models
        id: cache-ai
        uses: actions/cache@v4
        with:
          path: |
            llama.cpp
            models
          key: Linux-ai-engine-v1

      - name: Build llama.cpp
        if: steps.cache-ai.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y build-essential cmake
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DGGML_NATIVE=ON
          cmake --build llama.cpp/build --config Release -j4

      - name: Download Models
        if: steps.cache-ai.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install huggingface_hub
          mkdir -p models
          hf download Qwen/Qwen3-VL-4B-Instruct-GGUF Qwen3VL-4B-Instruct-Q4_K_M.gguf --local-dir models
          hf download Qwen/Qwen3-VL-4B-Instruct-GGUF mmproj-Qwen3VL-4B-Instruct-F16.gguf --local-dir models

      - name: Generate Matrix
        id: set-matrix
        run: |
          PDF=$(find input -type f -iname "*.pdf" | head -n 1)
          if [ -z "$PDF" ]; then echo "No PDF found."; exit 1; fi
          PAGES=$(pdfinfo "$PDF" | grep Pages | awk '{print $2}')
          MATRIX_JSON=$(seq 1 $PAGES | jq -R . | jq -s -c 'map(tonumber)')
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  process:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        page: ${{ fromJson(needs.prep.outputs.matrix) }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          python3 -m pip install pillow requests

      - name: Retrieve Cache
        uses: actions/cache@v4
        with:
          path: |
            llama.cpp
            models
          key: Linux-ai-engine-v1

      - name: Ensure Server is Executable
        run: chmod +x llama.cpp/build/bin/llama-server

      - name: Render Target Page
        run: |
          mkdir -p pages
          PDF=$(find input -type f -iname "*.pdf" | head -n 1)
          pdftoppm -f ${{ matrix.page }} -l ${{ matrix.page }} -singlefile -jpeg -r 120 "$PDF" pages/page_${{ matrix.page }}

      - name: Start Qwen3-VL Server
        run: |
          llama.cpp/build/bin/llama-server \
            -m models/Qwen3VL-4B-Instruct-Q4_K_M.gguf \
            --mmproj models/mmproj-Qwen3VL-4B-Instruct-F16.gguf \
            --host 127.0.0.1 --port 8080 -c 8192 -ngl 0 > server.log 2>&1 &
          
          for i in {1..120}; do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 5
          done

      - name: Analyze & Refine Page
        run: |
          mkdir -p output
          python3 scripts/test_page.py ${{ matrix.page }}

      - name: Upload Page Output
        uses: actions/upload-artifact@v4
        with:
          name: output-page-${{ matrix.page }}
          path: output/
          if-no-files-found: ignore

  merge:
    needs: process
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all outputs
        uses: actions/download-artifact@v4
        with:
          path: downloaded_outputs

      - name: Merge JSONs
        run: python3 scripts/merge_jsons.py

      - name: Organize Images and Commit
        run: |
          mkdir -p images
          find downloaded_outputs -type f -name "*.jpg" -exec cp {} images/ \;
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add question_bank.json
          git add images/
          
          if ! git diff --cached --quiet; then
            git commit -m "AI: Process, parallel refine, and merge PDF PYQs"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
