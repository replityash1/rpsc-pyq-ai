name: Test PYQ AI

on:
  workflow_dispatch:
  push:
    paths:
      - "input/**"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            curl \
            poppler-utils

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            pymupdf \
            pillow \
            requests \
            huggingface_hub

      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git

          cmake -S llama.cpp -B llama.cpp/build \
            -DGGML_NATIVE=ON

          cmake --build llama.cpp/build \
            --config Release \
            -j4

      - name: Download Qwen3-VL
        run: |
          mkdir -p models

          hf download \
            Qwen/Qwen3-VL-4B-Instruct-GGUF \
            --include "Qwen3-VL-4B-Instruct-Q4_K_M.gguf" \
            --local-dir models

          hf download \
            Qwen/Qwen3-VL-4B-Instruct-GGUF \
            --include "mmproj-BF16.gguf" \
            --local-dir models

          echo "Downloaded model files:"
          ls -lh models/

      - name: Find PDF
        id: pdf
        run: |
          PDF=$(find input -type f -iname "*.pdf" | head -n 1)

          if [ -z "$PDF" ]; then
            echo "ERROR: No PDF found inside input/"
            exit 1
          fi

          echo "Found PDF: $PDF"
          echo "pdf=$PDF" >> "$GITHUB_OUTPUT"

      - name: Render first page
        run: |
          mkdir -p pages

          pdftoppm \
            -f 1 \
            -singlefile \
            -jpeg \
            -r 120 \
            "${{ steps.pdf.outputs.pdf }}" \
            pages/page1

          echo "Rendered page:"
          ls -lh pages/

      - name: Start Qwen3-VL
        run: |
          echo "Starting Qwen3-VL..."

          llama.cpp/build/bin/llama-server \
            -m models/Qwen3-VL-4B-Instruct-Q4_K_M.gguf \
            --mmproj models/mmproj-BF16.gguf \
            --host 127.0.0.1 \
            --port 8080 \
            -c 8192 \
            -ngl 0 \
            > server.log 2>&1 &

          echo $! > server.pid

          echo "Waiting for model to become ready..."

          READY=0

          for i in {1..120}; do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then
              echo "Model is ready!"
              READY=1
              break
            fi

            echo "Waiting... ($i/120)"
            sleep 5
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Model did not become ready."
            echo "========== SERVER LOG =========="
            cat server.log
            exit 1
          fi

      - name: Analyze first page
        run: |
          mkdir -p output

          python3 scripts/test_page.py

      - name: Show generated result
        run: |
          echo "======================================"
          echo "          GENERATED JSON"
          echo "======================================"

          cat output/page_1.json

          echo ""
          echo "======================================"
          echo "          SERVER LOG (last 100 lines)"
          echo "======================================"

          tail -n 100 server.log || true

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if ! git diff --cached --quiet; then
            git commit -m "AI: process PYQ page 1"
            git push
          else
            echo "No output changes to commit."
          fi
