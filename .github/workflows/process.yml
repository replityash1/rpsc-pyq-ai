name: Test PYQ AI

on:
  workflow_dispatch:
  push:
    paths:
      - "input/**"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Install system dependencies
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            curl \
            poppler-utils

      # ---------------------------------------------------------
      # 3. Install Python packages
      # ---------------------------------------------------------
      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip

          python3 -m pip install \
            pillow \
            requests \
            huggingface_hub

      # ---------------------------------------------------------
      # 4. Build llama.cpp
      # ---------------------------------------------------------
      - name: Build llama.cpp
        run: |
          echo "Cloning llama.cpp..."

          git clone --depth 1 \
            https://github.com/ggml-org/llama.cpp.git

          echo "Configuring..."

          cmake \
            -S llama.cpp \
            -B llama.cpp/build \
            -DGGML_NATIVE=ON

          echo "Building..."

          cmake \
            --build llama.cpp/build \
            --config Release \
            -j4

          echo "Checking llama-server..."

          test -f llama.cpp/build/bin/llama-server

          echo "llama-server successfully built."

      # ---------------------------------------------------------
      # 5. Download Qwen3-VL
      # ---------------------------------------------------------
      - name: Download Qwen3-VL
        run: |
          mkdir -p models

          echo "Downloading Qwen3-VL 4B Q4_K_M..."

          hf download \
            Qwen/Qwen3-VL-4B-Instruct-GGUF \
            Qwen3VL-4B-Instruct-Q4_K_M.gguf \
            --local-dir models

          echo "Downloading vision projector..."

          hf download \
            Qwen/Qwen3-VL-4B-Instruct-GGUF \
            mmproj-Qwen3VL-4B-Instruct-F16.gguf \
            --local-dir models

          echo ""
          echo "======================================"
          echo "Downloaded model files"
          echo "======================================"

          ls -lh models/

          echo ""
          echo "Checking required files..."

          test -f \
            models/Qwen3VL-4B-Instruct-Q4_K_M.gguf

          test -f \
            models/mmproj-Qwen3VL-4B-Instruct-F16.gguf

          echo "Both model files exist."

      # ---------------------------------------------------------
      # 6. Find the input PDF
      # ---------------------------------------------------------
      - name: Find PDF
        id: pdf
        run: |
          PDF=$(find input -type f -iname "*.pdf" | head -n 1)

          if [ -z "$PDF" ]; then
            echo "ERROR: No PDF found inside input/"
            exit 1
          fi

          echo "Found PDF:"
          echo "$PDF"

          echo "pdf=$PDF" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 7. Render ONLY page 2
      # ---------------------------------------------------------
      - name: Render second page
        run: |
          mkdir -p pages

          echo "Rendering page 2..."

          pdftoppm \
            -f 2 \
            -singlefile \
            -jpeg \
            -r 120 \
            "${{ steps.pdf.outputs.pdf }}" \
            pages/page2

          echo ""
          echo "Rendered files:"
          ls -lh pages/

          test -f pages/page2.jpg

          echo "Page 2 successfully rendered."

      # ---------------------------------------------------------
      # 8. Start Qwen3-VL
      # ---------------------------------------------------------
      - name: Start Qwen3-VL
        run: |
          echo "Starting Qwen3-VL..."

          llama.cpp/build/bin/llama-server \
            -m models/Qwen3VL-4B-Instruct-Q4_K_M.gguf \
            --mmproj models/mmproj-Qwen3VL-4B-Instruct-F16.gguf \
            --host 127.0.0.1 \
            --port 8080 \
            -c 8192 \
            -ngl 0 \
            > server.log 2>&1 &

          SERVER_PID=$!

          echo "$SERVER_PID" > server.pid

          echo "llama-server PID: $SERVER_PID"

          echo ""
          echo "Waiting for model to become ready..."

          READY=0

          for i in {1..120}; do

            if curl -sf \
              http://127.0.0.1:8080/health \
              > /dev/null; then

              echo ""
              echo "======================================"
              echo "MODEL IS READY"
              echo "======================================"

              READY=1
              break
            fi

            echo "Waiting... ($i/120)"

            sleep 5

          done

          if [ "$READY" -ne 1 ]; then

            echo ""
            echo "======================================"
            echo "MODEL FAILED TO START"
            echo "======================================"

            echo ""
            echo "SERVER LOG:"
            cat server.log

            exit 1
          fi

      # ---------------------------------------------------------
      # 9. Analyze second page
      # ---------------------------------------------------------
      - name: Analyze second page
        run: |
          mkdir -p output

          python3 scripts/test_page.py

      # ---------------------------------------------------------
      # 10. Show generated result
      # ---------------------------------------------------------
      - name: Show result
        run: |
          echo ""
          echo "======================================"
          echo "GENERATED JSON"
          echo "======================================"

          if [ -f output/page_2.json ]; then
            cat output/page_2.json
          else
            echo "No JSON output was produced."

            if [ -f output/page_2_raw.txt ]; then
              echo ""
              echo "RAW MODEL OUTPUT:"
              cat output/page_2_raw.txt
            fi

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "SERVER LOG - LAST 100 LINES"
          echo "======================================"

          tail -n 100 server.log || true

      # ---------------------------------------------------------
      # 11. Commit generated JSON
      # ---------------------------------------------------------
      - name: Commit result
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if ! git diff --cached --quiet; then

            git commit \
              -m "AI: process PYQ page 2"

            git push

          else

            echo "No output changes to commit."

          fi
